<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>Bateria por sonido</title>
<style>
  :root{--bg:#0e0f12;--card:#191b20;--line:#2a2d35;--txt:#e8eaed;--dim:#8b919c;--ok:#37d67a;--warn:#ffb020;--bad:#ff5252;--blue:#2b6cff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0 auto;background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;padding:12px 12px 28px;max-width:760px}
  h1{font-size:17px;margin:4px 0 14px;font-weight:650}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button{background:#23262d;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
  button:active{transform:scale(.97)}
  button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  button.ghost{background:transparent}
  button.danger{background:#3a1a1a;border-color:#5a2626;color:#ff8a8a}
  button:disabled{opacity:.4}
  .meter{height:8px;background:#0a0b0e;border-radius:4px;overflow:hidden;flex:1;min-width:100px}
  .meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .05s linear}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .pad{background:#15171c;border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;cursor:pointer;user-select:none}
  .pad.hit{border-color:var(--ok);background:#16281d}
  .pad.learning{border-color:var(--warn);animation:pulse 1s infinite}
  .pad.sel{border-color:var(--blue);box-shadow:0 0 0 2px #2b6cff44 inset}
  @keyframes pulse{50%{background:#2a2113}}
  .pad .n{font-size:11px;color:var(--dim)}
  .pad .v{font-size:13px;font-weight:650;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pad .c{font-size:10px;color:var(--dim);margin-top:3px}
  label{font-size:12px;color:var(--dim);display:block;margin-bottom:4px}
  input[type=range]{width:100%;accent-color:var(--blue)}
  .log{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim);max-height:130px;overflow:auto;background:#0a0b0e;border-radius:8px;padding:8px;margin-top:8px}
  .log b{color:var(--txt)}
  .stat{font-size:12px;color:var(--dim)}
  .tag{display:inline-block;padding:2px 7px;border-radius:999px;font-size:11px;font-weight:700}
  .t-ok{background:#12341f;color:var(--ok)}.t-bad{background:#341414;color:var(--bad)}.t-warn{background:#33280d;color:var(--warn)}.t-off{background:#26282e;color:var(--dim)}
  .big{font-size:15px;padding:13px 20px}
  .rec{background:#3a1212;border-color:#6b2020;color:#ff9a9a;animation:blink 1.1s infinite}
  @keyframes blink{50%{background:#551818}}
  .kv{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid #22252b}
  .kv:last-child{border:0}
  .kv span:last-child{color:var(--txt);font-weight:600;font-family:ui-monospace,monospace}
</style>
</head>
<body>

<h1>Bateria por sonido</h1>

<div class="card">
  <div class="row" style="margin-bottom:10px">
    <button id="btnPower" class="big primary">Encender</button>
    <button id="btnRec" disabled>Grabar</button>
    <span id="state" class="tag t-off">apagado</span>
  </div>
  <div class="row" style="margin-bottom:8px">
    <span class="stat">nivel</span>
    <div class="meter"><i id="lvl"></i></div>
    <span class="stat" id="lvlDb" style="min-width:52px;text-align:right">-</span>
  </div>
  <div class="row">
    <button id="btnHead" class="ghost">Auriculares</button>
    <button id="btnCal" class="ghost">Calibrar</button>
    <button id="btnLat" class="ghost">Medir latencia</button>
  </div>
  <div class="stat" id="routeInfo" style="margin-top:8px"></div>
</div>

<div class="card">
  <div class="row" style="justify-content:space-between;margin-bottom:8px">
    <b style="font-size:13px">Grabacion</b>
    <span class="stat" id="recTime">0:00</span>
  </div>
  <div class="row">
    <button id="btnExport" disabled>Exportar MP3</button>
    <button id="btnExportWav" disabled>Exportar WAV</button>
    <button id="btnClearRec" class="ghost" disabled>Borrar</button>
  </div>
  <div class="stat" id="recInfo" style="margin-top:8px">sin grabacion</div>
</div>

<div class="card">
  <div class="row" style="justify-content:space-between;margin-bottom:6px">
    <b style="font-size:13px">Anti-retroalimentacion</b>
    <span class="tag t-ok" id="fbState">activo</span>
  </div>
  <label>Bloqueo despues de cada sonido <span id="blankVal">120 ms</span></label>
  <input type="range" id="blank" min="0" max="400" step="10" value="120">
  <div class="stat">Si el parlante dispara el trigger, subi este valor. Con auriculares podes bajarlo a 0.</div>
  <div class="row" style="margin-top:8px">
    <button id="btnFbTest" class="ghost">Probar</button>
  </div>
</div>

<div class="card">
  <label>Umbral de golpe <span id="thrVal">3.5x</span></label>
  <input type="range" id="thr" min="1.5" max="10" step="0.1" value="3.5">
  <label style="margin-top:10px">Exigencia <span id="tolVal">3.0</span></label>
  <input type="range" id="tol" min="1.5" max="6" step="0.1" value="3">
  <label style="margin-top:10px">Volumen <span id="volVal">100%</span></label>
  <input type="range" id="vol" min="0" max="100" step="1" value="100">
  <div class="row" style="margin-top:10px">
    <label style="margin:0;display:flex;align-items:center;gap:6px">
      <input type="checkbox" id="showDist" style="width:auto;accent-color:var(--blue)">
      <span style="font-size:12px;color:var(--dim)">mostrar distancias (para calibrar)</span>
    </label>
  </div>
  <div class="stat" id="noise" style="margin-top:8px"></div>
</div>

<div class="card">
  <div class="row" style="justify-content:space-between;margin-bottom:8px">
    <b style="font-size:13px">Pads</b>
    <span class="stat">toca un pad y despues "aprender"</span>
  </div>
  <div class="grid" id="pads"></div>
  <div class="row" style="margin-top:10px">
    <button id="btnLearn" class="primary" disabled>Aprender pad</button>
    <button id="btnCancelLearn" class="ghost">Cancelar</button>
    <button id="btnAll" class="ghost">Aprender todos</button>
  </div>
  <div class="stat" id="learnState" style="margin-top:6px"></div>
</div>

<div class="card">
  <label>Cargar muestras reales (wav/mp3), una por pad en orden</label>
  <input type="file" id="files" accept="audio/*" multiple style="font-size:12px;color:var(--dim)">
  <div class="log" id="log"></div>
</div>

<script src="lame.min.js"></script>
<script>
"use strict";

var $ = function(id){ return document.getElementById(id); };
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function nowMs(){ return performance.now(); }

var PAD_DEF = ["bombo","redoblante","charles","tom","bombo2","rim","crash","clap"];
var NBANDS = 10;

var S = {
  ctx:null, stream:null, src:null, node:null, analyser:null, mute:null,
  powered:false, running:false,
  noiseFloor:0.008, calibrated:false,
  pads:[], selected:0, learning:null, learnBuf:[], learnAll:false, allIdx:0,
  kit:null, edges:null, fftN:1024, freq:null,
  recording:false, recStart:0, recChunks:[], recBlob:null, recorder:null, recDest:null,
  suppressUntil:0, blankMs:120,
  useWorklet:false, masterGain:null
};

function loadModel(){
  try{
    var raw = localStorage.getItem("drumModel.v3");
    if(!raw) return;
    var m = JSON.parse(raw);
    if(Array.isArray(m)) m.forEach(function(p,i){ if(S.pads[i]) S.pads[i].samples = p||[]; });
  }catch(e){}
}
function saveModel(){
  try{ localStorage.setItem("drumModel.v3", JSON.stringify(S.pads.map(function(p){return p.samples;}))); }catch(e){}
}

function log(msg){
  var el = $("log"), line = document.createElement("div");
  line.innerHTML = msg;
  el.insertBefore(line, el.firstChild);
  while(el.children.length>60) el.removeChild(el.lastChild);
}

function synthKit(ctx){
  var sr = ctx.sampleRate;
  function mk(dur, fn){
    var b = ctx.createBuffer(1, Math.max(1, Math.floor(sr*dur)), sr);
    var d = b.getChannelData(0), i;
    for(i=0;i<d.length;i++) d[i] = fn(i/sr, i, d.length);
    return b;
  }
  function noise(){ return Math.random()*2-1; }
  function env(t,dur,p){ return Math.pow(Math.max(0,1-t/dur), p); }
  return {
    bombo: mk(0.42, function(t){ var f=140*Math.exp(-t*28)+45; return Math.sin(2*Math.PI*f*t)*env(t,0.42,2.4)*0.95; }),
    redoblante: mk(0.24, function(t){
      var tone = Math.sin(2*Math.PI*185*t)*env(t,0.24,6)*0.5;
      return noise()*env(t,0.24,3.5)*0.55 + tone;
    }),
    charles: mk(0.09, function(t){ return noise()*env(t,0.09,4)*0.35; }),
    tom: mk(0.45, function(t){ var f=210*Math.exp(-t*9)+95; return Math.sin(2*Math.PI*f*t)*env(t,0.45,2)*0.8; }),
    bombo2: mk(0.35, function(t){ var f=110*Math.exp(-t*30)+40; return Math.sin(2*Math.PI*f*t)*env(t,0.35,2.6)*0.9; }),
    rim: mk(0.06, function(t){ return noise()*env(t,0.06,6)*0.5; }),
    crash: mk(0.9, function(t){ return noise()*env(t,0.9,2.2)*0.22; }),
    clap: mk(0.22, function(t){
      var burst = t<0.02?1:(t<0.05?0.6:(t<0.08?0.9:0.35));
      return noise()*env(t,0.22,3)*0.5*burst;
    })
  };
}

/* ================= ENCENDIDO / APAGADO ================= */
async function powerOn(){
  if(S.running) return;
  if(!S.ctx){
    S.ctx = new (window.AudioContext||window.webkitAudioContext)({latencyHint:"interactive", sampleRate:48000});
    S.kit = synthKit(S.ctx);
    S.masterGain = S.ctx.createGain();
    S.masterGain.gain.value = parseFloat($("vol").value)/100;
    S.masterGain.connect(S.ctx.destination);
  }
  if(S.ctx.state === "suspended") await S.ctx.resume();

  S.stream = await navigator.mediaDevices.getUserMedia({
    audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false, channelCount:1, latency:{ideal:0.01} }
  });

  S.src = S.ctx.createMediaStreamSource(S.stream);

  // el analizador solo alimenta el medidor; no va al destino, asi no se cuela
  // el microfono al parlante
  S.analyser = S.ctx.createAnalyser();
  // debe coincidir con fftN: el camino compatible calcula las bandas sobre
  // este mismo espectro
  S.analyser.fftSize = S.fftN;
  S.analyser.smoothingTimeConstant = 0;
  S.src.connect(S.analyser);
  S.freq = new Float32Array(S.analyser.frequencyBinCount);

  S.useWorklet = false;
  if(S.ctx.audioWorklet){
    try{
      await S.ctx.audioWorklet.addModule("detector-worklet.js");
      S.node = new AudioWorkletNode(S.ctx, "hit-detector", {
        numberOfInputs:1, numberOfOutputs:1, outputChannelCount:[1],
        processorOptions:{ thr: parseFloat($("thr").value) }
      });
      S.node.port.onmessage = function(e){ onWorkletMsg(e.data); };
      S.useWorklet = true;
    }catch(err){
      log("worklet no disponible, uso modo compatible: "+err.message);
    }
  }
  if(!S.useWorklet){
    S.node = S.ctx.createScriptProcessor(256, 1, 1);
    S.edges = bandEdges(S.ctx.sampleRate, S.fftN);
    S.node.onaudioprocess = function(e){
      var buf = e.inputBuffer.getChannelData(0), sum=0, i;
      for(i=0;i<buf.length;i++) sum += buf[i]*buf[i];
      legacyDetect(Math.sqrt(sum/buf.length));
    };
  }

  S.src.connect(S.node);
  // el grafo necesita un destino para correr; se cierra con ganancia 0 para
  // no devolver el microfono al parlante
  S.mute = S.ctx.createGain();
  S.mute.gain.value = 0;
  S.node.connect(S.mute);
  S.mute.connect(S.ctx.destination);

  S.running = true; S.powered = true;
  S.masterGain.gain.setValueAtTime(parseFloat($("vol").value)/100, S.ctx.currentTime);
  $("btnPower").textContent = "Apagar";
  $("btnPower").classList.remove("primary");
  $("btnPower").classList.add("danger");
  $("btnRec").disabled = false;
  $("btnLearn").disabled = false;
  setState("escuchando", "ok");
  updateRoute();
  calibrate();
  log("encendido ("+(S.useWorklet?"AudioWorklet":"ScriptProcessor")+"), calibrando...");
}

function powerOff(){
  if(!S.running) return;
  if(S.recording) stopRecording();
  // cortar el audio ya mismo: los samples en curso seguian sonando despues
  // de apagar, que es justo lo que no se quiere
  if(S.masterGain){
    try{ S.masterGain.gain.cancelScheduledValues(S.ctx.currentTime); }catch(e){}
    S.masterGain.gain.setValueAtTime(0, S.ctx.currentTime);
  }
  S.powered = false; S.running = false;
  try{ S.src.disconnect(); }catch(e){}
  try{ S.node.disconnect(); }catch(e){}
  try{ S.mute.disconnect(); }catch(e){}
  if(S.stream){ S.stream.getTracks().forEach(function(t){ t.stop(); }); S.stream = null; }
  $("btnPower").textContent = "Encender";
  $("btnPower").classList.add("primary");
  $("btnPower").classList.remove("danger");
  $("btnRec").disabled = true;
  $("btnLearn").disabled = true;
  setState("apagado", "off");
  $("lvl").style.width = "0%";
  $("lvlDb").textContent = "-";
  $("routeInfo").textContent = "";
  log("apagado: no detecta ni reproduce nada");
}

function setState(text, kind){
  var el = $("state");
  el.textContent = text;
  el.className = "tag t-" + kind;
}

function onWorkletMsg(d){
  if(d.type === "onset"){
    onHit({ bands:d.bands, centroid:d.centroid, decay:d.decay, rms:d.rms, t:d.t });
  } else if(d.type === "calibrated"){
    S.calibrated = true; S.noiseFloor = d.noiseFloor;
    $("noise").textContent = "piso de ruido: "+(S.noiseFloor*1000).toFixed(1)+" (escala 0-1000)";
    log("calibrado, piso "+(S.noiseFloor*1000).toFixed(1));
  }
}

/* ---------- camino compatible ---------- */
function bandEdges(sr, n){
  var fmin=40, fmax=Math.min(12000, sr/2*0.95), e=[], i;
  for(i=0;i<=NBANDS;i++) e.push(fmin*Math.pow(fmax/fmin, i/NBANDS));
  return e.map(function(f){ return Math.round(f/(sr/2)*(n/2)); });
}
function fft(re, im){
  var n = re.length, i, j, bit, len, ang, wr, wi, k, cr, ci, ur, ui, vr, vi, ncr, t;
  for(i=1,j=0;i<n;i++){
    bit = n>>1;
    for(; j & bit; bit>>=1) j ^= bit;
    j ^= bit;
    if(i<j){ t=re[i];re[i]=re[j];re[j]=t; t=im[i];im[i]=im[j];im[j]=t; }
  }
  for(len=2;len<=n;len<<=1){
    ang = -2*Math.PI/len; wr = Math.cos(ang); wi = Math.sin(ang);
    for(i=0;i<n;i+=len){
      cr = 1; ci = 0;
      for(k=0;k<len/2;k++){
        ur = re[i+k]; ui = im[i+k];
        vr = re[i+k+len/2]*cr - im[i+k+len/2]*ci;
        vi = re[i+k+len/2]*ci + im[i+k+len/2]*cr;
        re[i+k] = ur+vr; im[i+k] = ui+vi;
        re[i+k+len/2] = ur-vr; im[i+k+len/2] = ui-vi;
        ncr = cr*wr - ci*wi; ci = cr*wi + ci*wr; cr = ncr;
      }
    }
  }
}
function featuresLegacy(){
  S.analyser.getFloatFrequencyData(S.freq);
  var bins = S.freq.length, bands = [], b, a, z, i, s, c, mag, num=0, den=0;
  for(b=0;b<NBANDS;b++) bands.push(0);
  for(b=0;b<NBANDS;b++){
    a = clamp(S.edges[b],0,bins-1);
    z = clamp(S.edges[b+1],a+1,bins);
    s=0; c=0;
    for(i=a;i<z;i++){
      mag = Math.pow(10, S.freq[i]/20);
      s += mag; c += mag * (i*S.ctx.sampleRate/S.fftN);
    }
    bands[b] = s/(z-a);
    num += c; den += s;
  }
  var total = bands.reduce(function(x,y){return x+y;},0) || 1;
  return {
    bands: bands.map(function(v){ return v/total; }),
    centroid: clamp((den>0?num/den:0)/6000,0,1)
  };
}
var legacy = { armed:true, prevRms:0, lastOnset:0, calFrames:0, calibrated:false };
function legacyDetect(rms){
  if(!legacy.calibrated){
    legacy.calFrames++;
    if(legacy.calFrames===1) S.noiseFloor = rms || 0.005;
    else S.noiseFloor = S.noiseFloor*0.92 + rms*0.08;
    if(legacy.calFrames>60){
      legacy.calibrated = true; S.calibrated = true;
      S.noiseFloor = Math.max(S.noiseFloor, 0.0008);
      $("noise").textContent = "piso de ruido: "+(S.noiseFloor*1000).toFixed(1)+" (escala 0-1000)";
    }
    return;
  }
  var gate = S.noiseFloor * parseFloat($("thr").value);
  if(rms < S.noiseFloor*2.5) S.noiseFloor = S.noiseFloor*0.995 + rms*0.005;
  if(rms < gate*0.55) legacy.armed = true;
  var transient = rms > legacy.prevRms*1.3;
  legacy.prevRms = rms;
  var now = nowMs();
  if(legacy.armed && now > S.suppressUntil && rms > gate && transient && now - legacy.lastOnset > 45){
    legacy.armed = false; legacy.lastOnset = now;
    var f = featuresLegacy();
    onHit({ bands:f.bands, centroid:f.centroid, rms:rms, t:now });
  }
}

function calibrate(){
  legacy.calFrames = 0; legacy.calibrated = false; legacy.armed = true; legacy.prevRms = 0;
  S.calibrated = false;
  if(S.useWorklet && S.node) S.node.port.postMessage({ type:"calibrate" });
  $("noise").textContent = "calibrando... no hagas ruido por 2 segundos";
}

/* ================= CLASIFICACION ================= */
// Compara dos huellas. Se usa para mostrar cuanto se parece un golpe a lo
// aprendido (el numero que aparece al calibrar), no para decidir.
function distance(a,b){
  var d=0, i, x;
  var n = a.bands.length;
  for(i=0;i<n;i++){ x = (a.bands[i]||0)-(b.bands[i]||0); d += x*x; }
  d = Math.sqrt(d/n);
  var dc = Math.abs((a.centroid||0)-(b.centroid||0));
  var dd = Math.abs((a.decay||0)-(b.decay||0));
  return d + dc*0.5 + dd*0.8;
}

// Modelo por pad: media y desvio de CADA banda, mas centroide y decaimiento.
//
// Por que no un kNN con umbral: con objetos reales (pocas resonancias, mucho
// ruido de impacto, el mismo objeto sonando distinto segun donde lo golpees)
// la distancia entre objetos distintos queda en el mismo orden que la
// variacion del mismo objeto. Medido: 0.70x de separacion, o sea imposible.
//
// La solucion es no tratar todas las bandas igual. Al aprender se mide cuanto
// varia cada banda en ESE objeto: una banda estable es muy informativa y pesa
// mucho; una banda que se mueve (porque el golpe cae distinto) pesa poco. Eso
// es un modelo gaussiano por banda, y con los mismos datos sube de 50% a 100%.
//
// La distancia que devuelve es una verosimilitud normalizada: 0 = identico a
// lo aprendido, 1 = a un desvio tipico, 4 = a dos desvios, etc.
var SD_FLOOR = 1.5;      // piso del desvio: no confiar en bandas casi constantes
var CENTROID_SD = 0.12;  // variacion tipica del centroide entre golpes
var DECAY_SD = 0.20;     // variacion tipica del decaimiento

function padModel(p){
  if(p.model) return p.model;
  var n = p.samples.length, i, b, k;
  var nb = p.samples[0].bands.length;
  var mean = [], sd = [], cm = 0, dm = 0;
  for(b=0;b<nb;b++){ mean.push(0); sd.push(0); }
  for(i=0;i<n;i++){
    var s = p.samples[i];
    for(b=0;b<nb;b++) mean[b] += (s.bands[b]||0)/n;
    cm += (s.centroid||0)/n;
    dm += (s.decay||0)/n;
  }
  // Correccion de Bessel (dividir por n-1 en vez de n): con 5 muestras el
  // desvio medido con n subestima el real casi a la mitad, y entonces golpes
  // validos del mismo objeto quedan fuera del limite. Medido en un objeto que
  // varia mucho: sd real 2.9 contra 0.8 medido con 5 muestras.
  var dof = n > 1 ? n - 1 : 1;
  for(i=0;i<n;i++){
    var t = p.samples[i];
    for(b=0;b<nb;b++) sd[b] += Math.pow((t.bands[b]||0)-mean[b], 2)/dof;
  }
  for(b=0;b<nb;b++) sd[b] = Math.sqrt(sd[b]);

  // Con una sola muestra no hay desvio medido. En vez de rechazar todo, se usa
  // el desvio de un pad vecino ya aprendido como referencia; si no hay ninguno,
  // un valor conservador.
  var only = (n < 2);
  p.model = { mean:mean, sd:sd, cm:cm, dm:dm, nb:nb, only:only, n:n };
  return p.model;
}

// desvio de referencia para pads con una sola muestra
function referenceSd(){
  var acc = null, cnt = 0, i, b;
  S.pads.forEach(function(p){
    if(p.samples.length < 2) return;
    var m = padModel(p);
    if(!acc){ acc = []; for(b=0;b<m.nb;b++) acc.push(0); }
    for(b=0;b<m.nb;b++) acc[b] += m.sd[b];
    cnt++;
  });
  if(!cnt) return null;
  for(b=0;b<acc.length;b++) acc[b] /= cnt;
  return acc;
}

function padScore(f, p){
  var m = padModel(p);
  var nb = Math.min(m.nb, f.bands.length);
  var ref = m.only ? referenceSd() : null;
  var z = 0, b;
  for(b=0;b<nb;b++){
    var sd = m.only
      ? (ref ? Math.max(ref[b], SD_FLOOR) : SD_FLOOR * 3)
      : Math.max(m.sd[b], SD_FLOOR);
    var x = ((f.bands[b]||0) - m.mean[b]) / sd;
    z += x*x;
  }
  z /= (nb || 1);
  var dc = ((f.centroid||0) - m.cm) / CENTROID_SD;
  var dd = ((f.decay||0) - m.dm) / DECAY_SD;
  return z + dc*dc*0.5 + dd*dd*0.3;
}

// "exigencia" del slider: mas alto = acepta menos. Con 3.0 el limite es 4.0
// (dos desvios tipicos); con 6 baja a 2.0; con 1.5 sube a 8.0.
var BASE_LIMIT = 12.0;
var MIN_LIMIT = 1.2;

function classify(f){
  var exigencia = parseFloat($("tol").value);
  var best = -1, bestZ = Infinity, secondZ = Infinity;

  S.pads.forEach(function(p, i){
    if(!p.samples.length) return;
    var z = padScore(f, p);
    if(z < bestZ){ secondZ = bestZ; bestZ = z; best = i; }
    else if(z < secondZ){ secondZ = z; }
  });

  if(best < 0) return { pad:-1, d:Infinity, why:"sin aprender" };

  // Dos criterios, y el golpe tiene que pasar los dos:
  //
  // 1) Absoluto: el pad ganador tiene que explicar el golpe dentro de unos
  //    pocos desvios. Esto es lo que frena un ruido, que queda lejisimos de
  //    todo lo aprendido.
  // 2) Relativo: el ganador tiene que ser MUCHO mejor que el segundo pad.
  //    Esto es lo que frena un objeto que no se aprendio: queda parecido a
  //    todos por igual. Y no depende de la escala, que es la parte que fallaba
  //    con el criterio absoluto solo.
  //
  // Medido con objetos que se solapan: solo el absoluto dejaba pasar el 80% de
  // los objetos desconocidos; el relativo con 0.5 deja pasar 13%.
  var limit = Math.max(BASE_LIMIT / exigencia, MIN_LIMIT);
  var ratioMax = Math.min(0.9, 0.30 + 0.07 * exigencia);

  if(bestZ > limit)
    return { pad:-1, d:Math.sqrt(bestZ), limit:Math.sqrt(limit), why:"lejos" };

  if(secondZ < Infinity && bestZ > secondZ * ratioMax)
    return { pad:-1, d:Math.sqrt(bestZ), limit:Math.sqrt(limit), why:"ambiguo" };

  return { pad:best, d:Math.sqrt(bestZ), limit:Math.sqrt(limit) };
}

/* ================= GOLPE ================= */
function onHit(f){
  if(!S.powered) return;

  if(S.learning!==null){
    var padL = S.learning;
    S.learnBuf.push({ bands:f.bands, centroid:f.centroid, decay:f.decay||0 });
    flash(S.pads[padL].el);
    log("muestra "+S.learnBuf.length+" para <b>"+S.pads[padL].name+"</b>");
    if(S.learnBuf.length>=5) finishLearn();
    return;
  }

  var r = classify(f);
  if(r.pad>=0){
    flash(S.pads[r.pad].el);
    play(r.pad, clamp((f.rms||0)/(S.noiseFloor*8), 0.25, 1));
    if($("showDist").checked) log("→ <b>"+S.pads[r.pad].name+"</b> dist "+r.d.toFixed(2));
  } else {
    // la distancia dice cuanto le falto para entrar: si ronda la tolerancia,
    // conviene subirla; si esta lejisimos, es ruido y esta bien rechazarlo
    setState("no reconocido (dist "+r.d.toFixed(2)+")", "warn");
    setTimeout(function(){ if(S.powered) setState("escuchando","ok"); }, 900);
  }
}

function flash(el){
  el.classList.add("hit");
  setTimeout(function(){ el.classList.remove("hit"); }, 90);
}

/* ================= REPRODUCCION + ANTI-FEEDBACK ================= */
function play(pad, gain){
  if(!S.ctx || !S.kit || !S.powered) return;
  var p = S.pads[pad];
  var buf = p.buffer || S.kit[p.def] || S.kit.bombo;
  var s = S.ctx.createBufferSource();
  s.buffer = buf;
  var g = S.ctx.createGain();
  g.gain.value = 0.6 + 0.4*gain;
  s.connect(g);
  g.connect(S.masterGain);
  s.start();

  // lo que sale por el parlante lo vuelve a captar el microfono y dispararia
  // el trigger en loop: se cierra la deteccion mientras suena
  suppressFor(buf.duration*1000 + S.blankMs);
}

function suppressFor(ms){
  var until = nowMs() + ms;
  if(until > S.suppressUntil) S.suppressUntil = until;
  if(S.useWorklet && S.node) S.node.port.postMessage({ type:"suppress", ms: ms });
}

/* ================= GRABACION ================= */
function startRecording(){
  if(!S.running || S.recording) return;
  S.recChunks = [];
  S.recStart = nowMs();
  S.recording = true;

  // se graba lo que SUENA (la mezcla), que es lo que queres exportar; el
  // microfono solo dispara
  var dest = S.ctx.createMediaStreamDestination();
  S.masterGain.connect(dest);
  var opts = { mimeType:"audio/webm;codecs=opus" };
  if(!MediaRecorder.isTypeSupported(opts.mimeType)) opts = {};
  S.recorder = new MediaRecorder(dest.stream, opts);
  S.recDest = dest;
  S.recorder.ondataavailable = function(e){ if(e.data.size) S.recChunks.push(e.data); };
  S.recorder.start(250);

  $("btnRec").textContent = "Parar";
  $("btnRec").classList.add("rec");
  $("btnExport").disabled = true;
  $("btnExportWav").disabled = true;
  $("btnClearRec").disabled = true;
  setState("grabando", "bad");
  log("grabando...");
}

function stopRecording(){
  if(!S.recording) return;
  S.recording = false;
  var dur = nowMs() - S.recStart;
  S.recorder.onstop = function(){
    var blob = new Blob(S.recChunks, { type: S.recorder.mimeType || "audio/webm" });
    S.recBlob = blob;
    $("recInfo").textContent = "grabacion lista: "+fmtTime(dur/1000)+", "+(blob.size/1024).toFixed(0)+" KB";
    $("btnExport").disabled = false;
    $("btnExportWav").disabled = false;
    $("btnClearRec").disabled = false;
  };
  try{ S.recorder.stop(); }catch(e){}
  try{ S.masterGain.disconnect(S.recDest); }catch(e){}
  $("btnRec").textContent = "Grabar";
  $("btnRec").classList.remove("rec");
  setState("escuchando","ok");
  log("grabacion detenida");
}

function fmtTime(sec){
  var m = Math.floor(sec/60), s = Math.floor(sec%60);
  return m+":"+(s<10?"0":"")+s;
}

async function exportMp3(){
  if(!S.recBlob) return;
  $("btnExport").disabled = true;
  $("btnExport").textContent = "Convirtiendo...";
  try{
    var ab = await S.recBlob.arrayBuffer();
    var decoded = await S.ctx.decodeAudioData(ab.slice(0));
    var mp3 = encodeMp3(decoded, 192);
    download(new Blob([mp3], {type:"audio/mpeg"}), "bateria-"+stamp()+".mp3");
    log("MP3 exportado: "+(mp3.length/1024).toFixed(0)+" KB");
  }catch(err){
    log("no se pudo exportar MP3: "+err.message);
  }
  $("btnExport").disabled = false;
  $("btnExport").textContent = "Exportar MP3";
}

function encodeMp3(audioBuffer, kbps){
  var ch = audioBuffer.numberOfChannels;
  var sr = audioBuffer.sampleRate;
  var enc = new lamejs.Mp3Encoder(ch, sr, kbps || 192);
  var L = audioBuffer.getChannelData(0);
  var R = ch > 1 ? audioBuffer.getChannelData(1) : null;
  var n = L.length, BS = 1152, out = [], i, j, k, v;
  for(i=0;i<n;i+=BS){
    var end = Math.min(i+BS, n);
    var l16 = new Int16Array(end-i);
    for(k=0;k<l16.length;k++){
      v = L[i+k];
      l16[k] = v>1?32767:(v<-1?-32768:Math.round(v*32767));
    }
    if(R){
      var r16 = new Int16Array(end-i);
      for(k=0;k<r16.length;k++){
        v = R[i+k];
        r16[k] = v>1?32767:(v<-1?-32768:Math.round(v*32767));
      }
      out.push(new Uint8Array(enc.encodeBuffer(l16, r16)));
    } else {
      out.push(new Uint8Array(enc.encodeBuffer(l16)));
    }
  }
  var tail = enc.flush();
  if(tail.length) out.push(new Uint8Array(tail));

  var total = 0;
  for(j=0;j<out.length;j++) total += out[j].length;
  var res = new Uint8Array(total), off = 0;
  for(j=0;j<out.length;j++){ res.set(out[j], off); off += out[j].length; }
  return res;
}

async function exportWav(){
  if(!S.recBlob) return;
  try{
    var ab = await S.recBlob.arrayBuffer();
    var decoded = await S.ctx.decodeAudioData(ab.slice(0));
    var wav = encodeWav(decoded);
    download(new Blob([wav], {type:"audio/wav"}), "bateria-"+stamp()+".wav");
    log("WAV exportado: "+(wav.byteLength/1024).toFixed(0)+" KB");
  }catch(err){ log("no se pudo exportar WAV: "+err.message); }
}

function encodeWav(buf){
  var ch = buf.numberOfChannels, sr = buf.sampleRate, n = buf.length;
  var bytes = 44 + n*ch*2;
  var ab = new ArrayBuffer(bytes), v = new DataView(ab), o = 0, i, c, s;
  function str(x){ for(var k=0;k<x.length;k++) v.setUint8(o++, x.charCodeAt(k)); }
  function u32(x){ v.setUint32(o, x, true); o += 4; }
  function u16(x){ v.setUint16(o, x, true); o += 2; }
  str("RIFF"); u32(bytes-8); str("WAVE");
  str("fmt "); u32(16); u16(1); u16(ch); u32(sr); u32(sr*ch*2); u16(ch*2); u16(16);
  str("data"); u32(n*ch*2);
  var chans = [];
  for(c=0;c<ch;c++) chans.push(buf.getChannelData(c));
  for(i=0;i<n;i++){
    for(c=0;c<ch;c++){
      s = chans[c][i];
      s = s>1?1:(s<-1?-1:s);
      v.setInt16(o, Math.round(s<0?s*0x8000:s*0x7FFF), true); o += 2;
    }
  }
  return ab;
}

function stamp(){
  var d = new Date();
  function p(x){ return (x<10?"0":"")+x; }
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"-"+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
}

function download(blob, name){
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
}

/* ================= LATENCIA ================= */
async function measureLatency(){
  if(!S.ctx){ log("encende primero"); return; }
  var sr = S.ctx.sampleRate;
  var base = S.ctx.baseLatency || 0;
  var out = S.ctx.outputLatency || 0;
  var proc = (128/sr)*1000;
  var total = (base+out)*1000 + proc;

  var lines = [];
  lines.push(["frecuencia de muestreo", (sr/1000).toFixed(1)+" kHz"]);
  lines.push(["bloque de deteccion", proc.toFixed(2)+" ms"]);
  lines.push(["baseLatency (motor)", (base*1000).toFixed(1)+" ms"]);
  lines.push(["outputLatency (salida)", (out*1000).toFixed(1)+" ms"]);
  if(S.stream){
    var tr = S.stream.getAudioTracks();
    if(tr.length){
      var st = tr[0].getSettings();
      if(st.latency) lines.push(["latencia del microfono", (st.latency*1000).toFixed(1)+" ms"]);
    }
  }
  lines.push(["TOTAL estimada", total.toFixed(1)+" ms"]);

  var html = "";
  lines.forEach(function(l){ html += '<div class="kv"><span>'+l[0]+'</span><span>'+l[1]+'</span></div>'; });
  $("routeInfo").innerHTML = html;
  log("latencia total estimada: "+total.toFixed(1)+" ms");
}

/* Mide la latencia REAL de punta a punta: emite un click por el parlante, lo
   capta el microfono y compara los tiempos. Es lo que de verdad se siente al
   tocar, e incluye microfono + procesamiento + salida. */
async function measureRealLatency(){
  if(!S.running){ log("encende primero"); return; }
  log("midiendo latencia real... hace silencio");

  // el click de prueba no debe disparar ningun pad
  if(S.useWorklet && S.node) S.node.port.postMessage({ type:"pause", value:true });

  var sr = S.ctx.sampleRate;
  var dur = 0.6;
  var frames = Math.floor(sr*dur);

  // Grabar la entrada del microfono. El buffer tiene que ser chico: cada
  // muestra que se acumula en el buffer de captura se suma a la medicion como
  // si fuera latencia del sistema. Con 4096 se sumaban 85 ms que no existen.
  var bufSize = 1024;
  var rec = S.ctx.createScriptProcessor(bufSize, 1, 1);
  var captured = new Float32Array(frames);
  var pos = 0;
  var blockTimes = [];   // tiempo de audio de cada bloque capturado
  rec.onaudioprocess = function(e){
    var b = e.inputBuffer.getChannelData(0), i;
    blockTimes.push({ at: pos, t: e.playbackTime });
    for(i=0;i<b.length && pos<frames;i++) captured[pos++] = b[i];
  };
  S.src.connect(rec);
  var sink = S.ctx.createGain();
  sink.gain.value = 0;
  rec.connect(sink); sink.connect(S.ctx.destination);

  await new Promise(function(r){ setTimeout(r, 80); });

  // click: 5ms de ruido con envolvente corta, inconfundible
  var clickLen = Math.floor(sr*0.005);
  var cb = S.ctx.createBuffer(1, clickLen, sr);
  var cd = cb.getChannelData(0), i;
  for(i=0;i<clickLen;i++) cd[i] = (Math.random()*2-1) * Math.pow(1 - i/clickLen, 2);

  var t0 = S.ctx.currentTime + 0.05;   // margen para que arranque el grafo
  var srcNode = S.ctx.createBufferSource();
  srcNode.buffer = cb;
  var g = S.ctx.createGain();
  g.gain.value = 1;
  srcNode.connect(g); g.connect(S.ctx.destination);
  srcNode.start(t0);

  await new Promise(function(r){ setTimeout(r, dur*1000 + 120); });

  try{ S.src.disconnect(rec); }catch(e){}
  try{ rec.disconnect(); sink.disconnect(); }catch(e){}
  if(S.useWorklet && S.node) S.node.port.postMessage({ type:"pause", value:false });

  // buscar el pico de energia en lo capturado
  var peak = 0, peakIdx = -1, k;
  var win = Math.floor(sr*0.002);
  for(i=0;i<frames-win;i+=win){
    var e = 0;
    for(k=0;k<win;k++){ var v = captured[i+k]; e += v*v; }
    if(e > peak){ peak = e; peakIdx = i; }
  }

  if(peakIdx < 0 || peak <= 0){
    log("no se detecto el click; subi el volumen del parlante y repeti");
    return;
  }

  // cuando se capturo el pico, segun el reloj de audio (no un setTimeout)
  var capturedAt = null, bi;
  for(bi=0;bi<blockTimes.length;bi++){
    if(blockTimes[bi].at <= peakIdx) capturedAt = blockTimes[bi].t;
    else break;
  }
  var offsetMs = capturedAt === null
    ? (peakIdx/sr)*1000
    : (capturedAt - t0)*1000;
  var base = (S.ctx.baseLatency||0)*1000;
  var out = (S.ctx.outputLatency||0)*1000;

  // Lo medido es el recorrido completo del sonido: sale por el parlante,
  // cruza el aire, entra por el microfono. Eso incluye la salida y la entrada
  // del sistema, pero NO incluye el tiempo de analisis del detector.
  var percibida = Math.max(0, offsetMs) + 30;   // 30 ms = espera de analisis

  var lines = [];
  lines.push(["recorrido del sonido (medido)", Math.max(0,offsetMs).toFixed(0)+" ms"]);
  lines.push(["espera de analisis", "30 ms"]);
  lines.push(["lo que sentis al tocar", percibida.toFixed(0)+" ms"]);
  lines.push(["baseLatency del motor", base.toFixed(1)+" ms"]);
  lines.push(["outputLatency de salida", out.toFixed(1)+" ms"]);
  var html = "";
  lines.forEach(function(l){ html += '<div class="kv"><span>'+l[0]+'</span><span>'+l[1]+'</span></div>'; });
  $("routeInfo").innerHTML = html;
  log("latencia al tocar: "+percibida.toFixed(0)+" ms (sonido "+Math.max(0,offsetMs).toFixed(0)+" ms + 30 ms de analisis)");
}

async function useHeadphones(){
  if(!S.running){ log("encende primero"); return; }
  try{
    var devices = await navigator.mediaDevices.enumerateDevices();
    var outs = devices.filter(function(d){ return d.kind === "audiooutput"; });
    if(!outs.length){ log("el navegador no expone salidas; igual podes conectar auriculares"); return; }
    log("salidas: "+outs.map(function(d){ return d.label||"sin nombre"; }).join(", "));
    $("blank").value = 30;
    $("blankVal").textContent = "30 ms";
    S.blankMs = 30;
    if(S.useWorklet && S.node) S.node.port.postMessage({ type:"blank", value:30 });
    log("con auriculares el bloqueo se puede bajar a 0 ms");
  }catch(err){ log("no se pudieron listar las salidas: "+err.message); }
}

/* ================= APRENDIZAJE ================= */
function startLearn(pad){
  if(!S.running){ log("encende primero"); return; }
  S.learning = pad;
  S.learnBuf = [];
  S.pads.forEach(function(p){ p.el.classList.remove("learning"); });
  S.pads[pad].el.classList.add("learning");
  S.selected = pad;
  $("learnState").textContent = "golpea el objeto 5 veces (pad: "+S.pads[pad].name+")";
  log("aprendiendo <b>"+S.pads[pad].name+"</b>: golpea 5 veces");
}

function finishLearn(){
  var pad = S.learning;
  var keep = S.pads[pad].samples.concat(S.learnBuf).slice(-15);
  S.pads[pad].samples = keep;
  S.pads[pad].spread = undefined;
  S.pads[pad].model = undefined;
  S.pads[pad].el.classList.remove("learning");
  S.learning = null; S.learnBuf = [];
  saveModel(); render();
  log("<b>"+S.pads[pad].name+"</b> aprendido, "+keep.length+" muestras");
  $("learnState").textContent = "";
  if(S.learnAll) nextLearnAll();
}

function nextLearnAll(){
  var idx = -1, i;
  for(i=S.allIdx;i<S.pads.length;i++){
    if(S.pads[i].samples.length===0){ idx=i; break; }
  }
  S.allIdx = idx+1;
  if(idx<0){ S.learnAll=false; S.allIdx=0; log("aprendizaje completo"); $("learnState").textContent=""; return; }
  S.selected = idx; render();
  startLearn(idx);
}

/* ================= UI ================= */
function render(){
  var wrap = $("pads");
  wrap.innerHTML = "";
  S.pads.forEach(function(p,i){
    var d = document.createElement("div");
    d.className = "pad" + (i===S.selected?" sel":"");
    d.innerHTML = '<div class="n">'+(i+1)+'</div><div class="v">'+p.name+'</div><div class="c">'+
      (p.samples.length ? p.samples.length+" muestras" : "sin aprender")+'</div>';
    d.onclick = function(){ S.selected = i; render(); play(i,1); };
    p.el = d;
    wrap.appendChild(d);
  });
  $("btnLearn").disabled = !S.running;
}

function updateRoute(){
  var lines = [];
  lines.push(["detector", S.useWorklet ? "AudioWorklet 128 frames" : "ScriptProcessor 256"]);
  if(S.ctx){
    lines.push(["baseLatency", ((S.ctx.baseLatency||0)*1000).toFixed(1)+" ms"]);
    lines.push(["outputLatency", ((S.ctx.outputLatency||0)*1000).toFixed(1)+" ms"]);
  }
  var html = "";
  lines.forEach(function(l){ html += '<div class="kv"><span>'+l[0]+'</span><span>'+l[1]+'</span></div>'; });
  $("routeInfo").innerHTML = html;
}

function init(){
  S.pads = PAD_DEF.map(function(name){ return { name:name, def:name, samples:[], buffer:null, el:null }; });
  loadModel();
  render();

  $("btnPower").onclick = function(){
    if(S.running) powerOff();
    else powerOn().catch(function(err){
      setState("error","bad");
      log("no se pudo encender: "+err.message);
    });
  };

  $("btnRec").onclick = function(){ if(S.recording) stopRecording(); else startRecording(); };
  $("btnExport").onclick = exportMp3;
  $("btnExportWav").onclick = exportWav;
  $("btnClearRec").onclick = function(){
    S.recBlob = null; S.recChunks = [];
    $("recInfo").textContent = "sin grabacion";
    $("btnExport").disabled = true; $("btnExportWav").disabled = true; $("btnClearRec").disabled = true;
    log("grabacion borrada");
  };

  $("btnCal").onclick = function(){ if(S.running) calibrate(); };
  $("btnLat").onclick = measureRealLatency;
  $("btnHead").onclick = useHeadphones;
  $("btnFbTest").onclick = function(){
    play(0, 1);
    log("probe el pad 1: si se dispara solo, subi el bloqueo");
  };

  $("btnLearn").onclick = function(){ startLearn(S.selected); };
  $("btnCancelLearn").onclick = function(){
    if(S.learning!==null) S.pads[S.learning].el.classList.remove("learning");
    S.learning=null; S.learnBuf=[]; S.learnAll=false; $("learnState").textContent="";
  };
  $("btnAll").onclick = function(){
    var first=-1, i;
    for(i=0;i<S.pads.length;i++){ if(S.pads[i].samples.length===0){ first=i; break; } }
    if(first<0){ log("todos los pads ya tienen muestras"); return; }
    S.learnAll=true; S.allIdx=first;
    S.selected=first; render(); startLearn(first);
  };

  $("thr").oninput = function(e){
    var v = parseFloat(e.target.value);
    $("thrVal").textContent = v.toFixed(1)+"x";
    if(S.useWorklet && S.node) S.node.port.postMessage({ type:"thr", value:v });
  };
  $("tol").oninput = function(e){ $("tolVal").textContent = parseFloat(e.target.value).toFixed(1); };
  $("tol").title = "mas alto = exige que el golpe se parezca mas a lo aprendido";
  $("vol").oninput = function(e){
    var v = parseFloat(e.target.value);
    $("volVal").textContent = v+"%";
    if(S.masterGain) S.masterGain.gain.value = v/100;
  };
  $("blank").oninput = function(e){
    var v = parseFloat(e.target.value);
    S.blankMs = v;
    $("blankVal").textContent = v+" ms";
  };

  $("files").onchange = async function(e){
    var list = Array.prototype.slice.call(e.target.files), i, ab, buf;
    if(!S.ctx){
      S.ctx = new (window.AudioContext||window.webkitAudioContext)();
      S.kit = synthKit(S.ctx);
      S.masterGain = S.ctx.createGain();
      S.masterGain.gain.value = parseFloat($("vol").value)/100;
      S.masterGain.connect(S.ctx.destination);
    }
    for(i=0;i<list.length && i<S.pads.length;i++){
      try{
        ab = await list[i].arrayBuffer();
        buf = await S.ctx.decodeAudioData(ab);
        S.pads[i].buffer = buf;
        S.pads[i].name = list[i].name.replace(/\.[^.]+$/,"").slice(0,10);
        log("pad "+(i+1)+" <- "+list[i].name);
      }catch(err){ log("no se pudo decodificar "+list[i].name+": "+err.message); }
    }
    render();
  };

  document.addEventListener("keydown", function(e){
    var n = parseInt(e.key,10);
    if(n>=1 && n<=8){ S.selected=n-1; render(); play(n-1,1); }
  });

  setInterval(function(){
    if(S.recording) $("recTime").textContent = fmtTime((nowMs()-S.recStart)/1000);
    if(!S.running || !S.analyser) return;
    var td = new Float32Array(S.analyser.fftSize);
    S.analyser.getFloatTimeDomainData(td);
    var s = 0, i;
    for(i=0;i<td.length;i++) s += td[i]*td[i];
    var rms = Math.sqrt(s/td.length);
    var v = clamp(rms/(S.noiseFloor*12),0,1);
    $("lvl").style.width = (v*100).toFixed(0)+"%";
    $("lvlDb").textContent = (20*Math.log10(rms||1e-6)).toFixed(0)+" dB";
  }, 60);
}

window.addEventListener("load", init);
</script>
</body>
</html>
